name: Verificação
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: testes
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:teste@localhost:5432/testes
      DIRECT_URL: postgresql://postgres:teste@localhost:5432/testes
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/testes
      JWT_SECRET: chave-ficticia-para-testes-de-integracao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel backend/prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run build -w frontend
      - run: npm run typecheck
      - run: npm run lint
